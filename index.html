let svT;const save=()=>{try{localStorage.setItem('ss1',JSON.stringify(S))}catch(e){}if(TG&&TG.CloudStorage){clearTimeout(svT);svT=setTimeout(()=>{try{const v=pack();if(v.length<4000)TG.CloudStorage.setItem('ss1',v)}catch(e){}},1500)}};

function sellAll(){const t=S.inv.reduce((a,x)=>a+x.p,0);S.money+=t;S.st.earn+=t;S.inv=[];hud();inv();save()}
function buy(k){if(k=='med'){if(S.money<50)return toast('Не хватает денег');S.money-=50;S.hp=Math.min(100,S.hp+50)}else{const g=G.find(x=>x[0]==k);if(S.money<g[2])return toast('Не хватает денег');S.money-=g[2];S.gear[k]=1}all()}
function up(k){const g=G.find(x=>x[0]==k),L=S.gear[k],c=ucost(g,L);if(L>=23)return;if(L>=CAP[TOP()])return toast('Нужна локация '+(CAP.findIndex(x=>x>L)+1)+' для улучшения выше '+L+' ур.');if(S.money<c)return toast('Не хватает денег');S.money-=c;S.gear[k]=L+1;all()}
function buyCam(i){if(S.money<CAM[i][1])return toast('Не хватает денег');S.money-=CAM[i][1];S.cam=i;all()}
function goMap(i){S.top=Math.max(S.top||0,i,S.map);S.map=i;closePh();all()}
function post(i){if(!S.clips)return toast('Нет снятых видео — залезь на крышу!');const c=i==null?null:CO[i],mm=M[S.map].m;S.clips--;const v=Math.round((150+R()*250)*CAM[S.cam][2]*mm*(1+S.subs/400)*(c?1.5:1)),mo=Math.round(v*.04),sb=Math.round(v*.02+(c?c[1]*.08:0));S.money+=mo;S.subs+=sb;S.st.earn+=mo;S.st.views+=v;S.st.posts++;gain(10);vl=`Просмотры: ${v} · +${mo}$ · +${sb} подп.`+(c?` · коллаб: ${c[0]}`:'');all()}
function act(k){if(busy)return;busy=1;const t=k=='s'?2200:3200,p=$('#pb');mapR();p.style.transition='none';p.style.width='0';void p.offsetWidth;p.style.transition=`width ${t}ms linear`;p.style.width='100%';setTimeout(()=>done(k),t)}
function police(){const f=Math.round(Math.max(100,S.money)*S.pct/100);S.money-=f;S.st.fines++;S.st.fineSum+=f;S.pct+=10;let m=`🚔 Тебя спалила охрана и отвели в отделение. Штраф: ${f}$.`;if(S.money<=-1000){S.pct=10;m+=' Долг достиг −1000$ — проценты штрафа сброшены.'}return m}
function done(k){busy=0;$('#pb').style.width='0';let m;S.st[k=='s'?'search':'climb']++;
if(R()<gc())m=police();
else if(k=='s'){const t=[];
if(R()<Math.max(.05,.5-.1*gr('mask')-.25*gr('resp'))){const d=Math.max(5,30*(gr('resp')?Math.max(.15,1-.5*gr('resp')):1)-10*gr('gloves'));S.hp-=d;S.st.dust++;t.push(`Надышался пылью: −${d} HP`)}
const n=1+(R()<.25*gr('cutter')?1:0)+(R()<.25*gr('grinder')?1:0),f=[];
for(let i=0;i<n;i++){const L=M[S.map].L,w=L.map((x,j)=>x[3]*(x[1]!='Хлам'?1+.4*gr('torch'):1));let r=R()*w.reduce((a,b)=>a+b),j=0;while(j<w.length-1&&r>w[j]){r-=w[j];j++}S.inv.push({n:L[j][0],r:L[j][1],p:L[j][2]});S.st.found++;f.push(L[j][0])}
t.push('Найдено: '+f.join(', '));gain(8);m=t.join('. ')+'.'}
else{S.clips++;gain(15);m='🎬 Залез на крышу и снял видео! Выложи его в Сталкток через телефон.'}
if(S.hp<=0){const c=Math.round(100*M[S.map].m);S.money-=c;S.hp=50;m+=` Ты потерял сознание. Больница: −${c}$.`}
last=m;toast(m);all()}
setInterval(()=>{if(S.hp>0&&S.hp<100){S.hp=Math.min(100,S.hp+1);hud()}},3000);
{const gd=document.createElement('div');gd.id='gear';$('#hands').prepend(gd)}
{const o=$('#hands svg');if(o){o.outerHTML=PHANDS();const n=$('#hands svg');n.onclick=openPh;n.style.cssText='width:250px;max-width:100%;cursor:pointer'}}
all();
if(TG){try{document.documentElement.dataset.theme='dark';TG.ready();TG.expand();TG.disableVerticalSwipes&&TG.disableVerticalSwipes();TG.setHeaderColor&&TG.setHeaderColor('#14170f');TG.setBackgroundColor&&TG.setBackgroundColor('#14170f')}catch(e){}
if(TG.CloudStorage)TG.CloudStorage.getItem('ss1',(e,v)=>{if(e||!v)return;try{const c=unpack(JSON.parse(v));const sc=x=>x&&x.st?(x.st.search||0)+(x.st.climb||0)+(x.st.posts||0)+(x.st.earn>0?1:0):0;if(sc(c)>sc(S)){Object.assign(S,c);S.st=Object.assign({earn:0,views:0,posts:0,search:0,climb:0,fines:0,fineSum:0,dust:0,found:0},S.st);all()}}catch(x){}})}
</script></body></html>
